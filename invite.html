<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a game of Cambio</title>
<meta name="description" content="You've been invited to a live match of Cambio. Open the app to join, or get Cambio on the App Store.">
<meta property="og:title" content="You're invited to play Cambio">
<meta property="og:description" content="Join a live match - open the app, or get Cambio on the App Store.">
<link rel="icon" href="./assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Card Table After Dark - same palette/type pairing as index.html and privacy-policy.html. */
  :root {
    --ink-green: #1B3A2F;
    --surface: #234A3B;
    --border: #3D6E58;
    --chalk: #FAF3E3;
    --chalk-muted: #B9CBB9;
    --ember: #E8A33D;
    --ember-ink: #2A2320;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ink-green);
    color: var(--chalk);
    font-family: 'Karla', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 420px;
    width: 100%;
    margin: 24px;
    padding: 32px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    color: var(--ember);
    margin: 0 0 18px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 600;
    font-size: 1.5rem;
    margin: 0 0 10px;
    text-wrap: balance;
  }
  p { margin: 0 0 24px; color: var(--chalk-muted); }
  .button {
    display: block;
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
  }
  .button + .button { margin-top: 10px; }
  .button.primary { color: var(--ember-ink); background: var(--ember); }
  .button.primary:hover { filter: brightness(1.06); }
  .button.secondary { color: var(--chalk); background: transparent; border: 1.5px solid var(--border); }
  .button.secondary:hover { border-color: var(--ember); }
  .hint { margin: 16px 0 0; font-size: 0.86rem; }
</style>
</head>
<body>

<div class="card">
  <p class="wordmark">Cambio</p>
  <div id="invite-copy">
    <h1>You're invited to play</h1>
    <p>Someone invited you to a live match. If you already have Cambio, we just tried to open it - if nothing
    happened, tap below.</p>
  </div>
  <div id="invite-actions"></div>
</div>

<script>
  (function () {
    var APP_STORE_URL = 'https://apps.apple.com/us/app/cambio-online/id6800865019';
    var params = new URLSearchParams(window.location.search);
    var lobby = params.get('lobby');
    var code = params.get('code');
    var hasInvite = !!(lobby && code);
    var deepLink = hasInvite ? 'cambio://invite-lobby/' + encodeURIComponent(lobby) + '?code=' + encodeURIComponent(code) : null;

    if (!hasInvite) {
      document.getElementById('invite-copy').innerHTML =
        '<h1>Get Cambio</h1><p>A real-time card game of memory and bluffing, for up to 4 players.</p>';
    }

    var actions = document.getElementById('invite-actions');
    if (hasInvite) {
      // Silent attempt - a no-op if the app isn't installed, no visible error either way.
      window.location.href = deepLink;
      actions.innerHTML =
        '<a class="button primary" href="' + deepLink + '">Open Cambio</a>' +
        '<a class="button secondary" href="' + APP_STORE_URL + '">Get Cambio on the App Store</a>' +
        '<p class="hint">Just installed it? Come back to this link once you\'ve signed in to join the game.</p>';
    } else {
      actions.innerHTML = '<a class="button primary" href="' + APP_STORE_URL + '">Get Cambio on the App Store</a>';
    }
  })();
</script>

</body>
</html>
