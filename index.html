<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambio</title>
<meta name="description" content="Cambio is a real-time multiplayer card game of memory and bluffing for up to 4 players. Get it on the App Store.">
<link rel="icon" href="./assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Card Table After Dark - same palette/type pairing as the rest of the site. */
  :root {
    --ink-green: #1B3A2F;
    --surface: #234A3B;
    --border: #3D6E58;
    --chalk: #FAF3E3;
    --chalk-muted: #B9CBB9;
    --ember: #E8A33D;
    --ember-ink: #2A2320;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
    background: var(--ink-green);
    color: var(--chalk);
    font-family: 'Karla', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    max-width: 420px;
    width: 100%;
    padding: 36px 28px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    text-align: center;
  }
  .wordmark {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 1.7rem;
    color: var(--ember);
    margin: 0 0 18px;
  }
  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 1.7rem;
    line-height: 1.15;
    margin: 0 0 12px;
    text-wrap: balance;
  }
  h1 .accent { color: var(--ember); }
  p { margin: 0 0 24px; color: var(--chalk-muted); }
  .button {
    display: block;
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 14px 20px;
    font-family: 'Baloo 2', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--ember-ink);
    background: var(--ember);
    text-decoration: none;
  }
  .button:hover { filter: brightness(1.06); }
  footer { display: flex; gap: 18px; }
  footer a { font-size: 0.85rem; color: var(--chalk-muted); text-decoration: none; }
  footer a:hover { color: var(--chalk); }
</style>
</head>
<body>

<div class="card">
  <p class="wordmark">Cambio</p>
  <h1>Memorize. Bluff. <span class="accent">Slam.</span></h1>
  <p>The after-dinner card game, live and real-time on the App Store.</p>
  <a class="button" id="get-app" href="https://apps.apple.com/us/app/cambio-online/id6800865019">Get Cambio</a>
</div>

<footer>
  <a href="./support.html">Support</a>
  <a href="./privacy-policy.html">Privacy</a>
</footer>

<script>
  // Silent, best-effort - opens straight into the app for anyone who already has it installed.
  // A no-op if it's not installed, and the visible "Get Cambio" button above covers that case either way.
  window.location.href = 'cambio://';
</script>

</body>
</html>
